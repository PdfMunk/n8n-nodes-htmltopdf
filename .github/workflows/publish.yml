name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for OIDC Trusted Publishers provenance

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (required for OIDC Trusted Publishers support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish with provenance
        # Do NOT set NODE_AUTH_TOKEN here — it breaks OIDC authentication.
        # Provenance is generated automatically via Trusted Publishers.
        # --ignore-scripts skips prepublishOnly (which runs lint requiring
        # @n8n/node-cli — not a CI dep). Build is already done above.
        run: npm publish --provenance --access public --ignore-scripts
